<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Pixel Art Avatars - PapaPayaso</title>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            overflow: hidden;
            background-color: transparent; /* Transparente para OBS */
            width: 100vw;
            height: 100vh;
        }
        canvas {
            display: block;
            width: 100%;
            height: 100%;
            image-rendering: pixelated; /* Mantiene el look retro de consola antigua */
        }
    </style>
</head>
<body>

    <canvas id="canvasStream"></canvas>

    <script>
        const canal = 'papapayaso';
        const canvas = document.getElementById('canvasStream');
        const ctx = canvas.getContext('2d');

        // Ajustar resolución del lienzo
        function ajustarPantalla() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        ajustarPantalla();
        window.addEventListener('resize', ajustarPantalla);

        // Almacén de avatares activos
        const avatares = {};

        // Clase principal para dibujar y mover cada muñeco Pixel Art
        class PixelAvatar {
            constructor(id, nombre) {
                this.id = id;
                this.nombre = nombre;
                this.x = Math.random() * (canvas.width - 60);
                // Camina justo en el borde inferior (suelo simulado)
                this.y = canvas.height - 85; 
                this.velocidad = (Math.random() * 0.8 + 0.4) * (Math.random() > 0.5 ? 1 : -1);
                this.altoSalto = 0;
                this.velocidadY = 0;
                this.enElSuelo = true;
                this.timerVida = Date.now();
                
                // Matriz de color aleatoria única para este usuario
                this.colorCuerpo = `hsl(${Math.random() * 360}, 85%, 55%)`;
                this.colorDetalle = `hsl(${Math.random() * 360}, 90%, 40%)`;

                // Animación de caminata básica por software
                this.offsetPierna = 0;
            }

            actualizar() {
                // Actualizar posición X (Caminar)
                this.x += this.velocidad;
                
                // Rebotar en los bordes de la pantalla
                if (this.x < 0) { this.x = 0; this.velocidad *= -1; }
                if (this.x > canvas.width - 50) { this.x = canvas.width - 50; this.velocidad *= -1; }

                // Física básica para el comando de Salto (!saltar)
                if (!this.enElSuelo) {
                    this.altoSalto += this.velocidadY;
                    this.velocidadY -= 0.5; // Gravedad simulada
                    if (this.altoSalto <= 0) {
                        this.altoSalto = 0;
                        this.velocidadY = 0;
                        this.enElSuelo = true;
                    }
                }

                // Oscilación de piernas al moverse
                if (Math.abs(this.velocidad) > 0.1) {
                    this.offsetPierna = Math.sin(Date.now() * 0.01) * 4;
                } else {
                    this.offsetPierna = 0;
                }
            }

            dibujar() {
                const posX = this.x;
                const posY = this.y - this.altoSalto;

                ctx.save();

                // 1. DIBUJAR CUERPO PIXEL ART (Matriz de 8x8 píxeles simulada mediante bloques planos)
                ctx.fillStyle = this.colorCuerpo;
                ctx.fillRect(posX + 8, posY + 16, 32, 24); // Torso

                ctx.fillStyle = this.colorDetalle;
                ctx.fillRect(posX + 12, posY + 4, 24, 14); // Cabeza
                
                // Ojos robóticos brillantes (blancos)
                ctx.fillStyle = '#FFFFFF';
                ctx.fillRect(posX + 16, posY + 8, 6, 4);
                ctx.fillRect(posX + 26, posY + 8, 6, 4);

                // Pierna izquierda y derecha animadas alternativamente
                ctx.fillStyle = '#111111';
                ctx.fillRect(posX + 12, posY + 40, 6, 8 + this.offsetPierna); 
                ctx.fillRect(posX + 30, posY + 40, 6, 8 - this.offsetPierna);

                // 2. DIBUJAR TEXTO DEL NOMBRE DEL USUARIO
                ctx.fillStyle = 'rgba(0, 0, 0, 0.75)';
                ctx.font = 'bold 13px sans-serif';
                const anchoTexto = ctx.measureText(this.nombre).width;
                
                // Fondo del recuadro del nombre
                ctx.fillRect(posX + 24 - (anchoTexto / 2) - 6, posY - 22, anchoTexto + 12, 20);
                
                // Texto blanco
                ctx.fillStyle = '#FFFFFF';
                ctx.textAlign = 'center';
                ctx.fillText(this.nombre, posX + 24, posY - 8);

                ctx.restore();
            }

            saltar() {
                if (this.enElSuelo) {
                    this.velocidadY = 9; // Impulso inicial hacia arriba
                    this.enElSuelo = false;
                }
            }
        }

        // Bucle de renderizado continuo (60 FPS estables de dibujo sobre el lienzo)
        function bucleGamer() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            
            const tiempoActual = Date.now();
            for (let id in avatares) {
                const avatar = avatares[id];
                
                // Si el espectador pasa más de 3 minutos (180000 ms) sin hablar, su avatar se retira limpiamente
                if (tiempoActual - avatar.timerVida > 180000) {
                    delete avatares[id];
                    continue;
                }

                avatar.actualizar();
                avatar.dibujar();
            }
            requestAnimationFrame(bucleGamer);
        }
        bucleGamer();

        // CONEXIÓN AL CHAT DE TWITCH VIA WEBSOCKET DIRECTO
        const ws = new WebSocket('wss://irc-ws.chat.twitch.tv:443');

        ws.onopen = () => {
            ws.send('CAP REQ :twitch.tv/tags twitch.tv/commands');
            ws.send('NICK justinfan99823'); // Entrada de lectura anónima universal
            ws.send(`JOIN #${canal}`);
        };

        ws.onmessage = (event) => {
            const msg = event.data;

            if (msg.includes('PRIVMSG')) {
                const displayMatch = msg.match(/display-name=([^;]+)/);
                const userIdMatch = msg.match(/user-id=(\d+)/);
                
                const usuario = displayMatch ? displayMatch[1] : 'Espectador';
                const idUsuario = userIdMatch ? userIdMatch[1] : usuario;

                // Extraemos el texto exacto enviado por el usuario
                const partesMensaje = msg.split(`PRIVMSG #${canal} :`);
                const textoChat = partesMensaje[1] ? partesMensaje[1].trim().toLowerCase() : '';

                // Si el personaje no existe, lo creamos de inmediato en el mapa
                if (!avatares[idUsuario]) {
                    avatares[idUsuario] = new PixelAvatar(idUsuario, usuario);
                } else {
                    // Si ya existía, refrescamos su temporizador de vida activa
                    avatares[idUsuario].timerVida = Date.now();
                }

                const personaje = avatares[idUsuario];

                // EVALUACIÓN DE INTERACTIVIDAD POR COMANDOS
                if (textoChat.startsWith('!saltar')) {
                    personaje.saltar();
                } else if (textoChat.startsWith('!correr')) {
                    // Duplica su velocidad actual (máximo establecido para evitar desfases rápidos)
                    if (Math.abs(personaje.velocidad) < 2) personaje.velocidad *= 2.2;
                } else if (textoChat.startsWith('!parar')) {
                    personaje.velocidad = 0;
                } else {
                    // Si escribe un mensaje normal, hace un pequeño salto de alegría automáticamente
                    personaje.saltar();
                    // Si estaba parado, vuelve a caminar de forma aleatoria
                    if (personaje.velocidad === 0) personaje.velocidad = Math.random() > 0.5 ? 0.6 : -0.6;
                }
            }

            if (msg.startsWith('PING')) ws.send('PONG :tmi.twitch.tv');
        };
    </script>
</body>
</html>
