<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Overlay PapaPayaso - Emotes Activos</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            overflow: hidden;
            background-color: transparent; /* Totalmente transparente para OBS */
            font-family: 'Segoe UI', Arial, sans-serif;
        }
        #contenedor {
            position: relative;
            width: 100vw;
            height: 100vh;
        }
        .avatar-box {
            position: absolute;
            display: flex;
            flex-direction: column;
            align-items: center;
            animation: saltar 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
        }
        .avatar-img {
            width: 65px;
            height: 65px;
            border-radius: 50%;
            border: 3px solid #9146FF; /* Borde morado de Twitch */
            box-shadow: 0px 4px 10px rgba(0,0,0,0.5);
            background: #18181b;
            object-fit: contain;
        }
        .avatar-name {
            background: rgba(14, 14, 16, 0.9);
            color: #fff;
            padding: 2px 8px;
            border-radius: 10px;
            font-size: 13px;
            margin-top: 5px;
            font-weight: bold;
            white-space: nowrap;
            border: 1px solid #3f3f46;
        }
        @keyframes saltar {
            0% { transform: scale(0) translateY(30px); opacity: 0; }
            100% { transform: scale(1) translateY(0); opacity: 1; }
        }
        .fade-out {
            transition: all 0.5s ease;
            transform: scale(0.5) translateY(-30px);
            opacity: 0;
        }
    </style>
</head>
<body>

    <div id="contenedor"></div>

    <script>
        const canal = 'papapayaso';
        const contenedor = document.getElementById('contenedor');

        // Conexión segura WebSocket nativa con el servidor central de Twitch
        const ws = new WebSocket('wss://irc-ws.chat.twitch.tv:443');

        ws.onopen = () => {
            ws.send('CAP REQ :twitch.tv/tags twitch.tv/commands');
            ws.send('NICK justinfan88374'); // Identificador de lectura anónima
            ws.send(`JOIN #${canal}`);
            console.log('Conexión nativa establecida con el chat de PapaPayaso');
        };

        ws.onmessage = (event) => {
            const str = event.data;
            
            if (str.includes('PRIVMSG')) {
                // Extracción de metadatos nativos mediante expresiones regulares estables
                const displayMatch = str.match(/display-name=([^;]+)/);
                const userIdMatch = str.match(/user-id=(\d+)/);
                const emotesMatch = str.match(/emotes=([^;]+)/);
                
                const usuario = displayMatch ? displayMatch[1] : 'Espectador';
                const userId = userIdMatch ? userIdMatch[1] : usuario;

                // Evitamos duplicar avatares en la misma tanda
                if (document.getElementById(`av-${userId}`)) return;

                // ASIGNACIÓN DE IMAGEN:
                // Si el espectador incluye un emote en su mensaje, extraemos el ID del primer emote
                let fotoUrl = '';
                if (emotesMatch && emotesMatch[1]) {
                    const primerEmoteId = emotesMatch[1].split(':')[0];
                    // URL oficial de renderizado de CDN de Twitch para emotes en alta resolución (3.0)
                    fotoUrl = `https://jtvnw.net{primerEmoteId}/default/dark/3.0`;
                } else {
                    // Si escribe solo texto, generamos un avatar único, colorido y libre de bloqueos basado en su ID de usuario
                    fotoUrl = `https://dicebear.com{userId}`;
                }

                // Construcción del elemento gráfico en pantalla
                const div = document.createElement('div');
                div.id = `av-${userId}`;
                div.className = 'avatar-box';

                const img = document.createElement('img');
                img.className = 'avatar-img';
                img.src = fotoUrl;
                
                // Respaldo por si fallara el renderizado gráfico
                img.onerror = () => { 
                    img.src = 'https://jtvnw.net'; 
                };

                const nameDiv = document.createElement('div');
                nameDiv.className = 'avatar-name';
                nameDiv.innerText = usuario;

                div.appendChild(img);
                div.appendChild(nameDiv);
                contenedor.appendChild(div);

                // Posicionamiento en el tercio inferior de la transmisión
                div.style.left = `${Math.random() * (window.innerWidth - 120)}px`;
                div.style.top = `${(window.innerHeight * 0.7) + (Math.random() * (window.innerHeight * 0.16))}px`;

                // Temporizador: se desvanece a los 8 segundos y se borra completamente
                setTimeout(() => {
                    div.classList.add('fade-out');
                    setTimeout(() => div.remove(), 500);
                }, 8000);
            }
            
            // Mantener la conexión con el servidor respondiendo a los pings obligatorios de Twitch
            if (str.startsWith('PING')) ws.send('PONG :tmi.twitch.tv');
        };
    </script>
</body>
</html>
